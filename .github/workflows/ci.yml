name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            release-target: bun-linux-x64-baseline
            release-asset: linux-x64
          - runner: macos-15
            release-target: bun-darwin-arm64
            release-asset: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # tmux is the whole point of this tool, and ncurses-term carries the
      # tmux-256color entry that the private tmux config selects.
      # rsvg-convert is installed deliberately rather than left to whatever the
      # image happens to ship: the example scenario renders a PNG, and a runner
      # with no rasterizer at all fails it. Installing it also means the
      # rsvg-convert backend is exercised on both platforms instead of only
      # wherever ImageMagick happens to be preinstalled.
      - name: Install tmux and a rasterizer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux ncurses-term librsvg2-bin

      - name: Install tmux and a rasterizer (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux librsvg

      # The integration tests skip themselves when these are missing, which would
      # turn a broken runner into a green build. Fail loudly instead.
      - name: Verify the harness dependencies are present
        run: |
          tmux -V
          python3 --version
          rsvg-convert --version

      # install.sh is the first thing a user runs, so a shell syntax error there is worse than
      # anything the TypeScript linter could find. shellcheck is preinstalled on GitHub runners.
      - name: Check the shell scripts
        if: runner.os == 'Linux'
        run: |
          bash -n install.sh
          bash -n scripts/test-release-install.sh
          bash -n scripts/smoke-release.sh
          bash -n tests/fixtures/mouse-echo.sh
          shellcheck --severity=warning install.sh scripts/test-release-install.sh scripts/smoke-release.sh tests/fixtures/mouse-echo.sh

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run format:check

      # Also the backstop for silently skipped integration tests: if they do not
      # run, coverage drops far below the floor and this step fails.
      - run: bun run test:coverage

      # Keep the install path exercised on ordinary pull requests. The tag workflow repeats this
      # natively for all four release architectures before it publishes anything.
      - name: Smoke-test the release package
        run: |
          bun run build:release --target "${{ matrix.release-target }}"
          mkdir release-smoke
          tar -xzf "dist/tui-driver-${{ matrix.release-asset }}.tar.gz" -C release-smoke
          scripts/smoke-release.sh release-smoke/tui-driver/bin/tui
          scripts/test-release-install.sh "dist/tui-driver-${{ matrix.release-asset }}.tar.gz"
