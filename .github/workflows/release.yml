name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: validate release tag
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Require an annotated version tag on main
        id: tag
        run: |
          version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          test "$RELEASE_TAG" = "v$version"
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" +refs/heads/main:refs/remotes/origin/main
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$commit"
          git merge-base --is-ancestor "$commit" origin/main
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.asset }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64-baseline
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: darwin-x64
          - runner: macos-15
            target: bun-darwin-arm64
            asset: darwin-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux ncurses-term

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - run: bun install --frozen-lockfile

      - name: Build native standalone package
        run: |
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_SHA="$(git rev-parse HEAD)" \
            bun run build:release --target "${{ matrix.target }}"

      - name: Smoke-test standalone package
        run: |
          mkdir release-smoke
          tar -xzf "dist/tui-driver-${{ matrix.asset }}.tar.gz" -C release-smoke
          scripts/smoke-release.sh release-smoke/tui-driver/bin/tui
          scripts/test-release-install.sh "dist/tui-driver-${{ matrix.asset }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: tui-driver-${{ matrix.asset }}
          path: |
            dist/tui-driver-${{ matrix.asset }}.tar.gz
            dist/tui-driver-${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify assembled release
        working-directory: dist
        run: sha256sum --check *.sha256

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/install.sh
          prerelease=()
          case "$RELEASE_TAG" in
            *-*) prerelease+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "tui-driver $RELEASE_TAG" \
            --generate-notes \
            --draft \
            "${prerelease[@]}"
          gh release edit "$RELEASE_TAG" --draft=false

  verify-install:
    name: verify published install (${{ matrix.runner }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux ncurses-term

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Verify pinned and latest public installers
        env:
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          versions=("$RELEASE_TAG")
          case "$RELEASE_TAG" in
            *-*) ;;
            *) versions+=(latest) ;;
          esac
          for version in "${versions[@]}"; do
            url="$RELEASE_BASE/download/$version/install.sh"
            if [ "$version" = latest ]; then url="$RELEASE_BASE/latest/download/install.sh"; fi
            curl -fsSL --retry 3 "$url" -o "$root/install.sh"
            bash "$root/install.sh" --version "$version" --no-agents \
              --prefix "$root/$version/bin" --install-dir "$root/$version/data"
            test "$(env PATH=/usr/bin:/bin "$root/$version/bin/tui" --version)" = "tui-driver ${RELEASE_TAG#v}"
            TUI_DRIVER_HOME="$root/$version/state" "$root/$version/bin/tui" doctor
          done
